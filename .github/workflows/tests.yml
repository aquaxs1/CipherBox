name: Tests

# Runs the test suite on every push and pull request. The suite is pure
# stdlib + cryptography and touches no GUI, so it runs headless everywhere.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The suite prints check marks and box-drawing characters. Windows runners
  # can default to a legacy code page, where those raise UnicodeEncodeError.
  PYTHONIOENCODING: utf-8

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        # Oldest supported and current; the middle versions rarely differ.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only the crypto dependency is needed -- the suite never imports the GUI,
      # so customtkinter and Tk stay out of it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Run test suite
        run: python test_cipherbox.py

  syntax:
    name: Byte-compile all modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # main.py imports customtkinter, so it cannot be imported here -- but it
      # can still be checked for syntax errors before a release build tries.
      - name: Compile
        run: python -m compileall -q main.py crypto_utils.py config_manager.py test_cipherbox.py
